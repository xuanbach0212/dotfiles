general {
	gaps_in = 5
	gaps_out= 10

	border_size = 1

	col.active_border = 0xffffffff
	col.inactive_border = 0xff444444

	resize_on_border = true

	allow_tearing = false # true if higher rate

	layout = dwindle
}

decoration {
	rounding = 10
	rounding_power = 4

	active_opacity = 1
	inactive_opacity = 1

	shadow {
		enabled = true
		range = 4
		render_power = 3
		color = 0xee1a1a1a
	}

	blur {
		enabled = false
		size = 8
		passes = 1 
		vibrancy = 0.1696
	}
}

