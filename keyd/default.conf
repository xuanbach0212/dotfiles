[ids]
*

[main]
leftalt = layer(mac_cmd)

# [mac_cmd:A] means: unmapped keys in this layer still get Alt applied
# so Alt+H, Alt+J, Alt+K, Alt+L still work for WM
[mac_cmd:A]
# Clipboard & edit
c = C-c
v = C-v
x = C-x
z = C-z

# File & app
a = C-a
w = C-w
t = C-t
f = C-f
r = C-r

# Terminal copy/paste
leftshift+c = C-S-c
leftshift+v = C-S-v
